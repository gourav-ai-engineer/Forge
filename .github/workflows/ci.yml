name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Compile Python files
        run: python -m compileall -q forge src main.py forge_cli.py benchmarks
      - name: Lint Forge
        run: ruff check forge tests benchmarks forge_cli.py
      - name: Run tests
        run: pytest -q
      - name: Forge offline smoke test
        run: python forge_cli.py "Inspect this repository and run its tests" --repo . --json
      - name: Forge runtime benchmark
        run: python benchmarks/run_benchmark.py --json
      - name: Existing assistant smoke test
        run: python main.py --once --problem two-sum
