name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile Python
        run: python -m compileall -q forge forge_cli.py tests benchmarks
      - name: Lint
        run: ruff check forge tests benchmarks forge_cli.py
      - name: Unit tests
        run: pytest -q
      - name: Offline inspection smoke test
        run: python forge_cli.py "Inspect the repository" --repo . --json
      - name: Build sandbox image
        run: docker build -f Dockerfile.sandbox -t forge-sandbox:local .
      - name: Docker sandbox smoke test
        run: python benchmarks/sandbox_smoke.py
      - name: Runtime safety benchmark
        run: python benchmarks/run_benchmark.py --json
      - name: Deterministic repair-loop benchmark
        run: python benchmarks/agentic_recovery_benchmark.py --json
