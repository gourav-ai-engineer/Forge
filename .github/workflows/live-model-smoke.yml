name: Forge Live Model Smoke

on:
  workflow_dispatch:

jobs:
  live-model:
    runs-on: ubuntu-latest
    if: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Forge with OpenAI support
        run: python -m pip install --upgrade pip && pip install -e ".[openai,dev]"
      - name: Run live Forge smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORGE_MODEL: gpt-5.6-luna
        run: python scripts/live_model_smoke.py
