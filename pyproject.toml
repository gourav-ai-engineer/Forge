[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-autonomous-engineer"
version = "0.2.0"
description = "Bounded autonomous software-engineering runtime with guarded mutation, recovery, and sandboxed validation"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
openai = ["openai>=1.0,<3"]
dev = ["pytest>=8.3,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]
vector = ["chromadb>=0.5,<2"]

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "I001", "UP017"]
